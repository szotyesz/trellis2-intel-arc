name: trellis-xpu
services:
  trellis:                  # GPU runs: no network, weights come from the volume
    build: .
    image: trellis-xpu:dev
    network_mode: none
    devices: ["/dev/dri:/dev/dri"]
    # Host video and render group IDs: `getent group video render`.
    group_add: ["${VIDEO_GID:-983}", "${RENDER_GID:-987}"]
    ipc: host
    mem_limit: 26g          # fail this job, not the host
    memswap_limit: 26g
    cap_add: [IPC_LOCK]
    ulimits: { memlock: { soft: -1, hard: -1 } }
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HOME: /cache/hf
      HF_HUB_OFFLINE: "1"
      ONEAPI_DEVICE_SELECTOR: level_zero:gpu
      SYCL_CACHE_PERSISTENT: "1"
      SYCL_CACHE_DIR: /cache/sycl
      TRITON_CACHE_DIR: /cache/triton
    volumes: ["trellis-cache:/cache", "./input:/input:ro", "./out:/out"]
  fetch-weights:            # network and token, no GPU
    image: trellis-xpu:dev
    environment: { HF_HOME: /cache/hf, HF_TOKEN_PATH: /run/secrets/hf_token }
    secrets: [hf_token]
    volumes: ["trellis-cache:/cache"]
    command: ["/opt/venv/bin/python", "scripts/fetch_weights.py"]
  cpu-tests:                # no GPU
    image: trellis-xpu:dev
    network_mode: none
    command: ["/opt/venv/bin/python", "-m", "pytest", "-q", "tests"]
secrets:
  hf_token: { file: ./.secrets/hf_token }
volumes:
  trellis-cache: {}
