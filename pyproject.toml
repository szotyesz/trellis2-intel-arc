[project]
name = "trellis-xpu"
version = "0.1.0"
description = "TRELLIS.2 image-to-3D generation for Intel Arc GPUs (XPU)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch==2.15.0",
    "torchvision",
    "transformers",
    "huggingface_hub",
    "safetensors",
    "pillow",
    "numpy",
    "trimesh",
    "scipy",
    "tqdm",
]

[project.scripts]
trellis-generate = "generate:main"
